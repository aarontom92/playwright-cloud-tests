
name: Scheduled Playwright Tests

on:
  schedule:
    - cron: "7/10 * * * *"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04

    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PW_USER_AARON: ${{ secrets.PW_USER_AARON }}
      PW_PASS_AARON: ${{ secrets.PW_PASS_AARON }}
      PW_USER_REINIER: ${{ secrets.PW_USER_REINIER }}
      PW_PASS_REINIER: ${{ secrets.PW_PASS_REINIER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check quiet hours (Europe/Amsterdam)
        id: quiet
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Europe/Amsterdam
          HM=$(date +%H%M)
          echo "Local time: $(date)"
          if [ "$HM" -lt 630 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install modern Playwright
        if: steps.quiet.outputs.skip != 'true'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1
          npx playwright --version

      - name: Install Google Chrome
        if: steps.quiet.outputs.skip != 'true'
        run: npx playwright install chrome

      - name: Run Playwright tests
        if: steps.quiet.outputs.skip != 'true'
        run: npx playwright test

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalender-debug
          path: |
            debug-kalender.png
            debug-login.png
          if-no-files-found: ignore
